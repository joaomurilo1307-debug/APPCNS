services:
  app:
    image: ghcr.io/joaomurilo1307-debug/appcns:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://${APP_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      UPLOAD_DIR: /app/uploads
      RUN_SEED: ${RUN_SEED}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consominas-gestao.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.consominas-gestao.entrypoints=websecure"
      - "traefik.http.routers.consominas-gestao.tls.certresolver=letsencrypt"
      - "traefik.http.services.consominas-gestao.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
  uploads:
